<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEXUS — Fantasy Games</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }:root { --bg: #050508; --cyan: #00f5ff; --pink: #ff0066; --gold: #ffd700; --text: #e0e0f0; --dim: #6a6a8a; --card-bg: rgba(15,15,30,0.9); --border: rgba(0,245,255,0.15); }body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); cursor: none; }.cursor { position: fixed; width: 12px; height: 12px; background: var(--cyan); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); box-shadow: 0 0 15px var(--cyan); }.cursor-ring { position: fixed; width: 36px; height: 36px; border: 1px solid rgba(0,245,255,0.5); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%,-50%); transition: width 0.2s, height 0.2s; }body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 20px 60px; background: linear-gradient(180deg, rgba(5,5,8,0.95) 0%, transparent 100%); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }.logo { font-family: 'Orbitron', monospace; font-weight: 900; font-size: 1.8rem; letter-spacing: 4px; color: var(--cyan); text-shadow: 0 0 20px var(--cyan); text-decoration: none; }.logo span { color: var(--pink); }nav ul { display: flex; list-style: none; gap: 40px; }nav ul a { color: var(--dim); text-decoration: none; font-size: 0.95rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; transition: color 0.2s; }nav ul a:hover { color: var(--cyan); }.page-header { padding: 140px 60px 60px; z-index: 1; text-align: center; background: radial-gradient(ellipse 60% 40% at 50% 50%, rgba(139,0,255,0.1) 0%, transparent 60%); }.page-title { font-family: 'Orbitron', monospace; font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 900; letter-spacing: 4px; margin-bottom: 16px; color: var(--cyan); text-shadow: 0 0 30px var(--cyan); }.page-subtitle { font-size: 1.1rem; color: var(--dim); max-width: 600px; margin: 0 auto; }.breadcrumb { padding: 20px 60px 40px; }.breadcrumb a { color: var(--dim); text-decoration: none; font-size: 0.85rem; }.breadcrumb a:hover { color: var(--cyan); }.breadcrumb span { color: var(--dim); margin: 0 8px; }.breadcrumb .current { color: var(--text); }.section { padding: 0 60px 80px; }.games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2px; }.game-card { position: relative; background: var(--card-bg); border: 1px solid var(--border); overflow: hidden; transition: transform 0.3s, border-color 0.3s; cursor: none; }.game-card:hover { transform: translateY(-4px); border-color: rgba(0,245,255,0.4); }.game-card:hover .card-overlay { opacity: 1; }.game-card:hover .card-thumb { transform: scale(1.05); }.card-thumb-wrap { height: 200px; overflow: hidden; position: relative; }.card-thumb { width: 100%; height: 100%; transition: transform 0.4s; display: flex; align-items: center; justify-content: center; font-size: 5rem; }.card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(5,5,8,0.9) 0%, transparent 60%); opacity: 0; transition: opacity 0.3s; display: flex; align-items: flex-end; padding: 20px; }.play-btn { font-family: 'Orbitron', monospace; font-size: 0.65rem; letter-spacing: 3px; padding: 10px 20px; background: var(--cyan); color: #000; font-weight: 700; border: none; cursor: none; text-transform: uppercase; }.card-body { padding: 20px; }.card-genre { font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; color: var(--pink); margin-bottom: 8px; }.card-title { font-family: 'Orbitron', monospace; font-size: 1rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }.card-desc { font-size: 0.85rem; color: var(--dim); line-height: 1.6; margin-bottom: 16px; }.card-meta { display: flex; justify-content: space-between; align-items: center; }.rating { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--gold); font-family: 'Orbitron', monospace; font-weight: 700; }.badge { font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; padding: 4px 10px; border: 1px solid; }.badge-new { border-color: var(--cyan); color: var(--cyan); }.badge-hot { border-color: var(--pink); color: var(--pink); }.badge-top { border-color: var(--gold); color: var(--gold); }</style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
<nav><a href="Gamers_hub.html" class="logo">NEX<span>U</span>S</a><ul><li><a href="Gamers_hub.html#explore">Explore</a></li><li><a href="Gamers_hub.html#categories">Genres</a></li></ul></nav>
<div class="page-header"><h1 class="page-title">🧙 FANTASY GAMES</h1><p class="page-subtitle">Wield magic, slay dragons, and embark on legendary quests in mystical realms.</p></div>
<div class="breadcrumb"><a href="Gamers_hub.html">Home</a><span>/</span><a href="Gamers_hub.html#categories">Categories</a><span>/</span><span class="current">Fantasy</span></div>
<section class="section"><div class="games-grid" id="gamesGrid"></div></section>
<script>
const cursor = document.getElementById('cursor');
const ring = document.getElementById('cursorRing');
let mx = 0, my = 0, rx = 0, ry = 0;
document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; cursor.style.left = mx + 'px'; cursor.style.top = my + 'px'; });
function animateRing() { rx += (mx - rx) * 0.15; ry += (my - ry) * 0.15; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; requestAnimationFrame(animateRing); }
animateRing();
document.querySelectorAll('a,button,.game-card').forEach(el => {
  el.addEventListener('mouseenter', () => { ring.style.width = '60px'; ring.style.height = '60px'; });
  el.addEventListener('mouseleave', () => { ring.style.width = '36px'; ring.style.height = '36px'; });
});
const games = [
  { title:'DRAGON KINGDOMS', genre:'fantasy', emoji:'🐉', desc:'Summon mythical beasts and wield powerful magic in this epic fantasy adventure.', rating:'9.2', badge:'top' },
  { title:'REALM OF ETERNITY', genre:'fantasy', emoji:'🧙', desc:'An expansive fantasy RPG with over 200 hours of lore-rich exploration and branching narratives.', rating:'9.5', badge:'top' },
  { title:'ELVEN CHRONICLES', genre:'fantasy', emoji:'🏹', desc:'Play as an elven ranger protecting ancient forests from dark corruption.', rating:'8.8', badge:'hot' },
  { title:'WIZARD ACADEMY', genre:'fantasy', emoji:'📚', desc:'Attend a school of magic, learn spells, and uncover a conspiracy threatening the realm.', rating:'8.7', badge:'new' },
  { title:'DARK SORCERY', genre:'fantasy', emoji:'🔮', desc:'Master forbidden magic in this morally complex dark fantasy adventure.', rating:'8.9', badge:'hot' },
  { title:'KNIGHTS OF VALOR', genre:'fantasy', emoji:'⚔️', desc:'Lead your order of knights in an epic crusade against demonic invasion.', rating:'9.0', badge:'top' },
];
document.getElementById('gamesGrid').innerHTML = games.map(g => `
  <div class="game-card">
    <div class="card-thumb-wrap">
      <div class="card-thumb" style="background:linear-gradient(135deg,rgba(5,5,8,1) 0%,rgba(15,15,30,1) 100%)">${g.emoji}</div>
      <div class="card-overlay"><button class="play-btn">Explore ▶</button></div>
    </div>
    <div class="card-body">
      <div class="card-genre">${g.genre.toUpperCase()}</div>
      <div class="card-title">${g.title}</div>
      <div class="card-desc">${g.desc}</div>
      <div class="card-meta"><div class="rating">★ ${g.rating}</div><span class="badge badge-${g.badge}">${g.badge.toUpperCase()}</span></div>
    </div>
  </div>
`).join('');
</script>
</body>
</html>
